<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FYShuffle mailto generator</title>
  <script src="../dist/FYShuffle-dev.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      line-height: 1.5;
      margin: 32px auto;
      max-width: 840px;
      padding: 0 20px;
    }

    label {
      display: block;
      margin: 12px 0;
    }

    input,
    textarea {
      box-sizing: border-box;
      display: block;
      font: inherit;
      max-width: 520px;
      width: 100%;
    }

    textarea {
      min-height: 84px;
    }

    pre {
      border: 1px solid #d1d5db;
      overflow: auto;
      padding: 16px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>FYShuffle mailto generator</h1>
  <p>Generate a pasteable HTML snippet with obfuscated mailto fields.</p>

  <form id="generator">
    <label>
      Key
      <input name="key" type="number" value="123456" required>
    </label>
    <label>
      To
      <input name="to" type="email" value="hello@example.com" required>
    </label>
    <label>
      CC
      <input name="cc" type="text" placeholder="cc@example.com,cc2@example.com">
    </label>
    <label>
      BCC
      <input name="bcc" type="text">
    </label>
    <label>
      Subject
      <input name="subject" type="text">
    </label>
    <label>
      Body
      <textarea name="body"></textarea>
    </label>
    <label>
      Class
      <input name="className" type="text" value="fyshuffle-mailto">
    </label>
    <label>
      Visible fallback text
      <input name="text" type="text" value="Protected contact">
    </label>
    <label>
      Observer fallback text
      <input name="fallbackText" type="text" placeholder="Use the contact form below">
    </label>
    <fieldset>
      <legend>Mode</legend>
      <label>
        <input name="mode" type="radio" value="full" checked>
        Full
      </label>
      <label>
        <input name="mode" type="radio" value="compact">
        Compact
      </label>
    </fieldset>
    <button type="submit">Generate</button>
  </form>

  <h2>Inline fallback HTML</h2>
  <pre id="inline-output"></pre>

  <h2>Explicit fallback HTML</h2>
  <pre id="explicit-output"></pre>

  <h2>Decoded compact payload</h2>
  <pre id="synthetic-output"></pre>

  <script>
    const form = document.getElementById('generator');
    const inlineOutput = document.getElementById('inline-output');
    const explicitOutput = document.getElementById('explicit-output');
    const syntheticOutput = document.getElementById('synthetic-output');

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function generate() {
      const data = new FormData(form);
      const key = Number(data.get('key'));
      const mode = data.get('mode');
      const attrs = [['class', data.get('className') || 'fyshuffle-mailto']];
      const payload = { to: data.get('to') };
      const visibleText = data.get('text') || 'Protected contact';
      const fallbackText = data.get('fallbackText') || visibleText;

      for (const field of ['cc', 'bcc', 'subject', 'body']) {
        const value = data.get(field);
        if (value) {
          payload[field] = value;
        }
      }

      if (mode === 'compact') {
        attrs.push(['data-content', FYShuffle.FYForward(JSON.stringify(payload), key)]);
      } else {
        attrs.push(['data-content', FYShuffle.FYForward(data.get('to'), key)]);
        for (const field of ['cc', 'bcc', 'subject', 'body']) {
          const value = data.get(field);
          if (value) {
            attrs.push([`data-${field}-content`, FYShuffle.FYForward(value, key)]);
          }
        }
      }
      const attrText = attrs
        .map(([name, value]) => `${name}="${escapeHtml(value)}"`)
        .join(' ');
      const explicitAttrText = [...attrs, ['data-fallback-text', fallbackText]]
        .map(([name, value]) => `${name}="${escapeHtml(value)}"`)
        .join(' ');
      inlineOutput.textContent = `<span ${attrText}>${escapeHtml(fallbackText)}</span>`;
      explicitOutput.textContent = `<span ${explicitAttrText}>${escapeHtml(visibleText)}</span>`;
      syntheticOutput.textContent = JSON.stringify(payload, null, 2);
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      generate();
    });
    form.addEventListener('input', generate);
    generate();
  </script>
</body>
</html>
