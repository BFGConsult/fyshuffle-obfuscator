name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify release tag
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); const tag = process.env.GITHUB_REF_NAME; const allowed = new Set([pkg.version, 'v' + pkg.version]); if (!allowed.has(tag)) { console.error('Release tag ' + tag + ' does not match package version ' + pkg.version); process.exit(1); }"

      - name: Run tests
        run: npm test

      - name: Build release artifacts
        run: npm run build

      - name: Verify checked-in artifacts are current
        run: git diff --exit-code

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --access public
